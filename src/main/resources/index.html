<!DOCTYPE html>
<html><head>
<meta charset='UTF-8'>
<title>FileShare - 文件列表</title>
<script>
function deleteFile(encodedFileName, fileName) {
  if (confirm('确定要删除文件 "' + fileName + '"？')) {
    window.location.href = '/delete?file=' + encodedFileName;
  }
}
</script>
<style>
body { font-family: Arial, sans-serif; margin: 20px; }
h1 { color: #333; }
.upload-form { margin: 20px 0; padding: 20px; background: #f5f5f5; border-radius: 5px; }
table { width: 100%; border-collapse: collapse; margin-top: 20px; }
th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
th { background-color: #4CAF50; color: white; }
tr:hover { background-color: #f5f5f5; }
a { color: #2196F3; text-decoration: none; }
a:hover { text-decoration: underline; }
.download-btn { background-color: #4CAF50; color: white; padding: 5px 10px; border-radius: 3px; }
</style>
</head><body>
<h1>📁 FileShare 文件共享</h1>
<div class='upload-form'>
<h3>上传文件</h3>
<form action='/upload' method='post' enctype='multipart/form-data'>
<input type='file' name='file' id='file' required>
<input type='submit' value='上传' style='margin-left: 10px; padding: 5px 15px; background-color: #4CAF50; color: white; border: none; border-radius: 3px; cursor: pointer;'>
</form>
</div>
<h3>文件列表</h3>
<table>
<tr><th>文件名</th><th>大小</th><th>操作</th></tr>
{{FILE_LIST}}
</table>
</body></html>
